<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'none'; connect-src 'none'"><link rel="stylesheet" href="katex.min.css"><style>
:root{color-scheme:light dark;--fg:#1d1d1f;--muted:#6e6e73;--soft:rgba(0,0,0,.045);--code:rgba(0,0,0,.055);--border:rgba(0,0,0,.1);--accent:#0a84ff}
body.dark{--fg:#f2f2f7;--muted:#a1a1a6;--soft:rgba(255,255,255,.06);--code:rgba(255,255,255,.08);--border:rgba(255,255,255,.12);--accent:#409cff}
body{margin:0;padding:2px 6px 14px 2px;font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:var(--fg);background:transparent;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
main>:first-child{margin-top:0}
h1,h2,h3,h4{line-height:1.3;font-weight:650;margin:1.1em 0 .45em}h1{font-size:1.25em}h2{font-size:1.15em}h3,h4{font-size:1.05em}
p{margin:.35em 0 .8em}ul,ol{padding-left:1.4em;margin:.3em 0 .8em}li{margin:.2em 0}li::marker{color:var(--muted)}
strong{font-weight:650}hr{border:0;border-top:1px solid var(--border);margin:1em 0}
pre{position:relative;overflow-x:auto;white-space:pre;padding:12px 14px;margin:.6em 0 1em;border:1px solid var(--border);border-radius:10px;background:var(--code)}
code{font:13px/1.5 ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace}
p code,li code,td code{padding:1px 5px;border-radius:5px;background:var(--code);font-size:.88em}
table{border-collapse:separate;border-spacing:0;display:block;overflow-x:auto;margin:.6em 0 1em;border:1px solid var(--border);border-radius:10px}
th,td{padding:7px 11px;border-bottom:1px solid var(--border);text-align:left}th{background:var(--soft);font-weight:600}tr:last-child td{border-bottom:0}
blockquote{margin:.6em 0;padding:6px 12px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 8px 8px 0;color:var(--muted)}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:6px 0}.katex{font-size:1.08em}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.muted{opacity:.6}
</style><script src="marked.umd.js"></script><script src="purify.min.js"></script><script src="katex.min.js"></script><script src="auto-render.min.js"></script></head><body><main id="answer"></main><script>
const escapeHTML=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
marked.use({extensions:[
{name:'mathBlock',level:'block',start:s=>s.search(/\$\$|\\\[/),tokenizer(s){const m=/^(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\])(?:\n|$)/.exec(s);if(m)return{type:'mathBlock',raw:m[0],text:m[1]}},renderer:t=>'<div>'+escapeHTML(t.text)+'</div>'},
{name:'mathInline',level:'inline',start:s=>s.search(/\$|\\\(/),tokenizer(s){const m=/^(\\\([\s\S]*?\\\)|\$\$[\s\S]*?\$\$|\$(?!\$)[^\n$]+?\$)/.exec(s);if(m)return{type:'mathInline',raw:m[0],text:m[0]}},renderer:t=>escapeHTML(t.text)}]});
window.renderAnswer=(text,dark,streaming)=>{
 document.body.classList.toggle('dark',dark);const root=document.getElementById('answer');
 // A new answer starts at the top; a streaming one is never dragged down to its end.
 const fresh=!text.startsWith(window.lastAnswer||'\u0000');window.lastAnswer=text;
 root.innerHTML=DOMPurify.sanitize(marked.parse(text),{FORBID_TAGS:['img','iframe','style','script','input','form'],FORBID_ATTR:['style']});
 renderMathInElement(root,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],throwOnError:false,trust:false,strict:'ignore'});
 if(fresh)window.scrollTo(0,0);
 return {math:root.querySelectorAll('.katex').length,code:root.querySelectorAll('pre code').length,text:root.textContent,height:Math.ceil(root.getBoundingClientRect().height)+24};
};
</script></body></html>
